# RetroArch FFmpeg record-core config — H.264 in MPEG-TS for the WebRTC path.
#
# Unlike mpeg1video, H.264 has no fps restriction, so it encodes the GB's 59.7275fps
# directly — NO transcode. RetroArch records H.264/TS to a FIFO; publish.sh remuxes
# it (-c copy, cheap) to RTSP -> MediaMTX -> WebRTC. libx264 ultrafast+zerolatency is
# trivial CPU at 160x144 and far more reliable than the Pi's h264_v4l2m2m in the
# record core; swap vcodec to h264_v4l2m2m later if HW offload is ever needed.

vcodec = "libx264"
format = "mpegts"
pix_fmt = "yuv420p"
video_bitrate = 2000000
video_preset = "ultrafast"
video_tune = "zerolatency"
threads = 2
video_gpu_record = false

# Audio: record AAC; publish.sh transcodes it to Opus for WebRTC (the browser plays
# it muted by default — tap the speaker to unmute, per iOS autoplay rules).
acodec = "aac"
audio_bitrate = 128000
sample_rate = 48000
