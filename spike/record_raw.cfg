# RetroArch FFmpeg record-core config — MJPEG into a NUT container.
#
# Why not mpeg1video directly: the GB core runs at 59.7275 fps (262144/4389) and
# the MPEG-1 encoder only allows fixed broadcast rates, so it errors out. MJPEG
# has no fps restriction (every frame is independent), so it records fine; a
# downstream ffmpeg then transcodes MJPEG -> MPEG-1/TS at a forced -r 60 for jsmpeg.
# NUT is FFmpeg's native fully-streamable container (fine to write to a FIFO).

vcodec = "mjpeg"
acodec = "mp2"
format = "nut"
pix_fmt = "yuvj420p"
video_bitrate = 4000000
audio_bitrate = 64000
sample_rate = 32000
# MJPEG CBR warns against frame multi-threading; keep it single-threaded.
threads = 1
video_gpu_record = false
