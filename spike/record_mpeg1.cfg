# RetroArch FFmpeg record-core config — Phase 0 jsmpeg transport spike.
#
# Produces MPEG-1 video + MP2 audio in an MPEG-TS container, which is exactly
# jsmpeg's native input. RetroArch records the *core's* clean frame (pre-shader,
# pre-VC4-tiling) because video_gpu_record is false — so no de-tiling problem.
#
# Used non-interactively via:
#   retroarch ... -r <fifo>.ts --recordconfig spike/record_mpeg1.cfg
#
# Tuning notes (iterate on the Pi without code changes — this is just a cfg):
#   - GB is 160x144, GBA is 240x160; both are macroblock-aligned (mult. of 16),
#     so no --size override is needed. Add --size WxH to RetroArch to upscale.
#   - mpeg1video is software-encoded, but the frames are tiny so it's cheap.
#   - If latency is high, drop video_bitrate and/or set audio off in the player.

vcodec = "mpeg1video"
acodec = "mp2"
format = "mpegts"
pix_fmt = "yuv420p"

# bits/sec. GB/GBA frames are tiny; 800k is plenty and stays cellular/funnel-friendly.
video_bitrate = 800000
audio_bitrate = 64000
sample_rate = 32000

# Encode threads. Keep small on the Pi 3B (4 cores, but leave headroom).
threads = 2

# Record the raw core output, not the GPU-shaded (tiled) scanout buffer.
video_gpu_record = false
